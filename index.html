            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Leave it at 1 for a pure hours-based split. Raise it above 1 for roles that customarily get a larger share per hour (like servers over bussers), or below 1 for the reverse - there's no universal standard, so use whatever your workplace agrees on."
            }
          },
          {
            "@type": "Question",
            "name": "Why doesn't a simple hours split give clean numbers?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Splitting any pool into shares that don't divide evenly leaves fractional cents - this calculator distributes those fairly rather than rounding everyone down (which would lose money) or up (which would exceed the pool)."
            }
          },
          {
            "@type": "Question",
            "name": "Does this handle tax or reporting requirements?",
